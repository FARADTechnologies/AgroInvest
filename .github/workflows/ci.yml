name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agro
          POSTGRES_USER: agro
          POSTGRES_PASSWORD: agro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agro -d agro" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://agro:agro@localhost:5432/agro
      JWT_SECRET: ci-secret
      DEMO_PASSWORD: ci-demo-password
      UPLOAD_DIR: /tmp/uploads
      SEED_DIR: ${{ github.workspace }}/seed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: alembic upgrade head
      - run: pytest

  ektis-mock:
    name: EKTIS mock (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ektis-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q verify

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No secrets files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|id_rsa'; then
            echo "Secret files are tracked"; exit 1
          fi
      - name: No absolute local paths
        run: |
          hits=$(git ls-files -z | xargs -0 grep -l -E '([A-Za-z]:\\\\Users\\\\|/Users/[a-z]|/home/[a-z])' 2>/dev/null || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
      - name: No files over 5 MB
        run: |
          big=$(git ls-files -z | xargs -0 du -k 2>/dev/null | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then echo "$big"; exit 1; fi

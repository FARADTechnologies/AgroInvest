name: Keep Render awake

# Render's free web services sleep after 15 minutes without traffic; the next visitor then
# waits about a minute. One long-running job pings the API and the site every 10–12 minutes
# (a random interval, so the requests do not arrive on a fixed beat), always a few minutes
# before the sleep timer would run out.
#
# GitHub starts scheduled runs late or drops them (on 18 Oct the hourly schedule fired at
# 10:38 and then not again for hours), so the schedule only has to start one job somewhere in
# the five and a half hours before the window opens. That job sleeps until the window opens,
# and every job starts its own successor before GitHub's six-hour limit, until the window
# closes.
#
# Hours: the free plan gives 750 instance hours a month per workspace, shared by the API and
# the site. The repository variable KEEP_ALIVE_HOURS sets the Baku-time window, default 13-1
# (13:00 to 01:00, across midnight).
# The last ping goes out 15 minutes before the window ends, so both services are asleep when
# it closes: 2 services × 12 h × 31 days = 744 h. Visits outside the window use the remaining
# hours. Set 0-24 only on a paid plan, otherwise Render suspends the services for the rest of
# the month.
#
# Runs only while the repository is public: there Actions minutes are free.

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  actions: write # to start the next job in the chain

jobs:
  ping:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HOURS: ${{ vars.KEEP_ALIVE_HOURS || '13-1' }}
      URLS: >-
        https://farad-agro-api-o8bw.onrender.com/health
        https://farad-agro-web-ay30.onrender.com/login
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ping until the job's time is up
        run: |
          # Minutes of the day in Baku; a window such as 13-1 runs past midnight.
          start_min=$(( ${HOURS%-*} * 60 )); end_min=$(( ${HOURS#*-} * 60 ))
          len=$(( (end_min - start_min + 1440) % 1440 )); [ "$len" -eq 0 ] && len=1440
          now_min() { echo $(( 10#$(TZ=Asia/Baku date +%H) * 60 + 10#$(TZ=Asia/Baku date +%M) )); }
          stamp() { TZ=Asia/Baku date '+%H:%M:%S'; }
          # minutes since the window opened (0 … 1439)
          into() { echo $(( ($(now_min) - start_min + 1440) % 1440 )); }
          deadline=$(( $(date +%s) + 345 * 60 ))

          # Started before the window: wait for it if it opens within this job's lifetime.
          i=$(into)
          if [ "$i" -ge "$len" ]; then
            wait_min=$(( 1440 - i ))
            if [ "$wait_min" -gt 330 ]; then
              echo "$(stamp) the $HOURS window (Baku) opens in $wait_min minutes; a later run will cover it"
              exit 0
            fi
            echo "$(stamp) waiting $wait_min minutes for the $HOURS window (Baku)"
            sleep $(( wait_min * 60 ))
          fi

          while :; do
            # Stop 15 minutes before the window ends, so the services sleep when it closes.
            if [ "$(into)" -ge $(( len - 15 )) ]; then
              echo "$(stamp) the $HOURS window (Baku) is closing, stopping"
              exit 0
            fi
            for url in $URLS; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || true)
              echo "$(stamp) $url -> $code"
            done
            # 10–12 minutes plus a few random seconds: always ahead of the 15-minute sleep.
            pause=$(( 600 + RANDOM % 121 ))
            if [ $(( deadline - $(date +%s) )) -le "$pause" ]; then
              # Out of time while the window is still open: hand over to a new job, which
              # starts as soon as this one ends (same concurrency group).
              echo "$(stamp) starting the next job"
              gh workflow run keep-alive.yml --ref "${GITHUB_REF_NAME}" || echo "could not start the next job"
              exit 0
            fi
            sleep "$pause"
          done

# The portal's single entry point on the network (port 3000 on the host).
#
# It overwrites X-Forwarded-For with the address the request really came from, so
# the API's per-IP limits and audit log see the actual client and a client cannot
# spoof the header. API calls go straight to the API; everything else to the web app.

server {
    listen 80;
    server_tokens off;
    client_max_body_size 12m;  # uploads are limited to 10 MB by the API

    # Resolve the containers through Docker's DNS at request time: after `docker compose up
    # --build` a container may get a new address, and a cached one would answer 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
